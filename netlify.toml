[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  CIVILON_NETLIFY_BUILD = "true"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "https://www.cvlon.com/*"
  to = "https://cvlon.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/price-check/result"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Pragma = "no-cache"

[[headers]]
  for = "/price-check/result/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Pragma = "no-cache"

[[headers]]
  for = "/api/price-check/result/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
