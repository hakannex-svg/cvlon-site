AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Non-production private S3 quarantine, GuardDuty Malware Protection, and
  least-privilege application identity for Civilon marketplace (Sell Parts)
  evidence uploads. Deliberately a separate bucket and prefix from the Price
  Check upload stack: supplier evidence must not inherit a policy, lifecycle or
  scan configuration that was approved for a different workload.

  Nothing in this template grants public access, and nothing in it treats an
  untagged or non-clean object as readable. Evidence stored here is material for
  staff to look at — it is not company verification, custody proof,
  authenticity, certification, regulatory or airworthiness approval, or fitness.

Parameters:
  BucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Globally unique non-production bucket name without customer data.
  PreviewOrigin:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[a-z0-9-]+--cvlon\\.netlify\\.app$"
    Description: Exact Netlify Deploy Preview origin. Leave blank until the PR preview exists.

Conditions:
  HasPreviewOrigin: !Not [!Equals [!Ref PreviewOrigin, ""]]

Resources:
  MarketplaceUploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration: !If
        - HasPreviewOrigin
        - CorsRules:
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - POST
              AllowedOrigins:
                - !Ref PreviewOrigin
              ExposedHeaders:
                - ETag
              MaxAge: 600
        - !Ref AWS::NoValue
      # No object expiration anywhere in this bucket, deliberately.
      #
      # A lifecycle rule selects by prefix and tag, and marketplace evidence
      # carries neither distinction: the application writes every object under
      # marketplace/quarantine/ and never moves or retags one after a Sell
      # Submission claims it. A rule scoped to that prefix therefore cannot tell
      # an abandoned upload from bound evidence, and any expiration on it would
      # silently delete a supplier's file while the database still records the
      # attachment as present and clean. Reclaiming abandoned uploads is left to
      # a deliberate, record-aware cleanup rather than a blind age-out.
      #
      # The one rule kept below removes nothing that was ever stored: it only
      # discards the parts of a multipart upload that never completed.
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMarketplaceMultipartUploads
            Status: Enabled
            Prefix: marketplace/
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      Tags:
        - Key: Environment
          Value: non-production
        - Key: Workload
          Value: civilon-marketplace-uploads
        - Key: DataClassification
          Value: commercially-sensitive

  GuardDutyScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: civilon-marketplace-preview-guardduty
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GuardDutyMalwareProtectionForMarketplaceBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowManagedRuleToSendS3EventsToGuardDuty
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
                Condition:
                  StringLike:
                    events:ManagedBy: malware-protection-plan.guardduty.amazonaws.com
              - Sid: AllowGuardDutyToMonitorEventBridgeManagedRule
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*
              - Sid: AllowPostScanTag
                Effect: Allow
                Action:
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                  - s3:PutObjectVersionTagging
                  - s3:GetObjectVersionTagging
                Resource: !Sub ${MarketplaceUploadBucket.Arn}/marketplace/quarantine/*
              - Sid: AllowEnableS3EventBridgeEvents
                Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !GetAtt MarketplaceUploadBucket.Arn
              - Sid: AllowPutValidationObject
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${MarketplaceUploadBucket.Arn}/malware-protection-resource-validation-object
              - Sid: AllowCheckBucketOwnershipAndPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MarketplaceUploadBucket.Arn
              - Sid: AllowMalwareScan
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${MarketplaceUploadBucket.Arn}/marketplace/quarantine/*

  ApplicationUser:
    Type: AWS::IAM::User
    Properties:
      UserName: civilon-marketplace-preview-app
      Tags:
        - Key: Environment
          Value: non-production
        - Key: Workload
          Value: civilon-marketplace-uploads
      Policies:
        - PolicyName: MarketplacePreviewObjectAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The application may authorize a write only under the marketplace
              # quarantine prefix. It holds no permission anywhere else in the
              # bucket, so a Price Check object key is unreachable from this
              # identity even if one were somehow presented.
              - Sid: AuthorizeExactMarketplaceQuarantineUploads
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${MarketplaceUploadBucket.Arn}/marketplace/quarantine/*
              - Sid: InspectExactObjectMetadataAndScanTag
                Effect: Allow
                Action:
                  - s3:GetObjectAttributes
                  - s3:GetObjectTagging
                Resource: !Sub ${MarketplaceUploadBucket.Arn}/marketplace/*
              # Content is readable only after GuardDuty has tagged the object
              # clean. This is the infrastructure half of the fail-closed rule
              # the application enforces: even a bug that skipped the tag check
              # would be denied the bytes.
              - Sid: ReadOnlyObjectsThatGuardDutyTaggedClean
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${MarketplaceUploadBucket.Arn}/marketplace/*
                Condition:
                  StringEquals:
                    s3:ExistingObjectTag/GuardDutyMalwareScanStatus: NO_THREATS_FOUND
              - Sid: RemoveOwnedPreviewObjects
                Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub ${MarketplaceUploadBucket.Arn}/marketplace/quarantine/*

  MarketplaceUploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MarketplaceUploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MarketplaceUploadBucket.Arn
              - !Sub ${MarketplaceUploadBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: NoReadUnlessGuardDutyTaggedClean
            Effect: Deny
            NotPrincipal:
              AWS:
                - !GetAtt GuardDutyScanRole.Arn
                - !Sub arn:${AWS::Partition}:sts::${AWS::AccountId}:assumed-role/${GuardDutyScanRole}/GuardDutyMalwareProtection
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub ${MarketplaceUploadBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:ExistingObjectTag/GuardDutyMalwareScanStatus: NO_THREATS_FOUND
          - Sid: OnlyGuardDutyCanWriteScanStatus
            Effect: Deny
            NotPrincipal:
              AWS:
                - !GetAtt GuardDutyScanRole.Arn
                - !Sub arn:${AWS::Partition}:sts::${AWS::AccountId}:assumed-role/${GuardDutyScanRole}/GuardDutyMalwareProtection
            Action:
              - s3:PutObjectTagging
              - s3:PutObjectVersionTagging
            Resource: !Sub ${MarketplaceUploadBucket.Arn}/marketplace/*
            Condition:
              ForAnyValue:StringEquals:
                s3:RequestObjectTagKeys: GuardDutyMalwareScanStatus
          # Nothing outside the marketplace namespace may be written here at
          # all, so this bucket can never accumulate objects from another
          # workflow that would then inherit marketplace retention.
          - Sid: DenyWritesOutsideMarketplaceNamespace
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutObject
              - s3:PutObjectTagging
            NotResource:
              - !Sub ${MarketplaceUploadBucket.Arn}/marketplace/*
              - !Sub ${MarketplaceUploadBucket.Arn}/malware-protection-resource-validation-object

  MalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    DependsOn:
      - MarketplaceUploadBucketPolicy
    Properties:
      Role: !GetAtt GuardDutyScanRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref MarketplaceUploadBucket
          ObjectPrefixes:
            - marketplace/quarantine/
      Actions:
        Tagging:
          Status: ENABLED
      Tags:
        - Key: Environment
          Value: non-production
        - Key: Workload
          Value: civilon-marketplace-uploads

Outputs:
  MarketplaceUploadBucketName:
    Value: !Ref MarketplaceUploadBucket
  ApplicationUserName:
    Value: !Ref ApplicationUser
  GuardDutyRoleName:
    Value: !Ref GuardDutyScanRole
